[project]
name = "movie-match-api"
version = "0.1.0"
description = "Movie Match FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi[standard]>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=6,<7",
  "alembic>=1.16,<2",
  "argon2-cffi>=23.1,<26",
  "PyJWT>=2.10,<3",
  "httpx>=0.28,<1",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=1,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
