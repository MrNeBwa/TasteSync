services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: movie_match
      POSTGRES_USER: movie
      POSTGRES_PASSWORD: movie
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  postgres_data:
